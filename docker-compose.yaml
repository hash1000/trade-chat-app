version: '3'
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - './:/var/app'
      - '/var/app/node_modules'
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
    depends_on:
      - db
      - redis
    env_file:
      - .env
  db:
    image: 'mysql:5.7.29'
    platform: linux/x86_64
    ports:
      - '5020:3306'
    volumes:
      - './storage/mysql/.data:/var/lib/mysql'
    environment:
      MYSQL_USER: root
      MYSQL_PASSWORD: admin
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: db
  redis:
    image: 'redis:7-alpine'
    ports:
      - '6379:6379'
    volumes:
      - './storage/redis/.data:/data'
